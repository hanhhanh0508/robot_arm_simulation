joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 500

scaled_pos_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

  constraints:
    goal_time: 0.0                          # ✅ BỎ TIMEOUT
    stopped_velocity_tolerance: 0.5         # ✅ Tăng từ 0.2
    shoulder_pan_joint: {trajectory: 0.5, goal: 0.5}     # ✅ Nới lỏng
    shoulder_lift_joint: {trajectory: 0.5, goal: 0.5}    # ✅ Nới lỏng
    elbow_joint: {trajectory: 0.5, goal: 0.5}            # ✅ Nới lỏng
    wrist_1_joint: {trajectory: 0.5, goal: 0.5}          # ✅ Nới lỏng
    wrist_2_joint: {trajectory: 0.5, goal: 0.5}          # ✅ Nới lỏng
    wrist_3_joint: {trajectory: 0.5, goal: 0.5}          # ✅ Nới lỏng

  state_publish_rate: 500
  action_monitor_rate: 10